<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Interactive Camera App</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        :root {
            --bg-color: #0a0a0c;
            --panel-bg: rgba(20, 20, 25, 0.85);
            --accent-color: #00ffcc;
            --accent-glow: rgba(0, 255, 204, 0.5);
            --text-color: #ffffff;
            --text-muted: #8e8e93;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
            position: relative;
            height: 100vh;
            width: 100vw;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
        }

        canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* 自撮り用に鏡面反転 */
        }

        header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(45deg, #00ffcc, #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #recording-status {
            display: none;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: #ff3b30;
            animation: pulse 1.5s infinite;
        }

        #recording-dot {
            width: 10px;
            height: 10px;
            background-color: #ff3b30;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(255, 59, 48, 0.8);
        }

        .controls-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 40%, transparent);
            padding: 30px 20px 40px 20px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 24px;
            align-items: center;
        }

        .fx-selector {
            width: 100%;
            max-width: 600px;
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding: 5px;
            scrollbar-width: none;
        }

        .fx-selector::-webkit-scrollbar { display: none; }

        .fx-btn {
            flex: 0 0 auto;
            padding: 10px 20px;
            background: var(--panel-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .fx-btn.active {
            color: #000;
            background: var(--accent-color);
            border-color: var(--accent-color);
            box-shadow: 0 4px 15px var(--accent-glow);
            transform: scale(1.05);
        }

        .action-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            position: relative;
        }

        .record-btn-outer {
            width: 76px;
            height: 76px;
            border: 4px solid #ffffff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .record-btn-inner {
            width: 56px;
            height: 56px;
            background-color: #ffffff;
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .record-btn-outer.recording { border-color: rgba(255, 255, 255, 0.3); }
        .record-btn-outer.recording .record-btn-inner {
            background-color: #ff3b30;
            border-radius: 8px;
            transform: scale(0.75);
        }

        #loading-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #0a0a0c;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            letter-spacing: 2px;
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body>

    <div id="loading-overlay">AI ENGINE LOADING...</div>

    <header>
        <h1>AI-FX Engine v2.0</h1>
        <div id="recording-status">
            <div id="recording-dot"></div>
            <span id="recording-time">00:00</span>
        </div>
    </header>

    <div id="canvas-container">
        <canvas id="glCanvas"></canvas>
    </div>

    <div class="controls-container">
        <div class="fx-selector" id="fxSelector">
            <button class="fx-btn active" data-effect="none">RAW (NO FX)</button>
            <button class="fx-btn" data-effect="cyber_eye">👁️ CYBER EYE</button>
            <button class="fx-btn" data-effect="hand_aura">✨ HAND AURA</button>
            <button class="fx-btn" data-effect="glitch">CYBER GLITCH</button>
            <button class="fx-btn" data-effect="vhs">Y2K VHS</button>
        </div>

        <div class="action-container">
            <div class="record-btn-outer" id="recordBtn">
                <div class="record-btn-inner"></div>
            </div>
        </div>
    </div>

    <video id="video" autoplay playsinline muted style="display:none;"></video>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('glCanvas');
        const ctx = canvas.getContext('2d');
        const recordBtn = document.getElementById('recordBtn');
        const fxSelector = document.getElementById('fxSelector');
        const recStatus = document.getElementById('recording-status');
        const recTime = document.getElementById('recording-time');
        const loadingOverlay = document.getElementById('loading-overlay');

        let currentEffect = 'none';
        let mediaRecorder;
        let recordedChunks = [];
        let isRecording = false;
        let startTime;
        let timerInterval;

        // AIトラッキングデータ保持用オブジェクト
        let aiData = {
            faceLandmarks: null,
            handLandmarks: null
        };

        let glitchT = 0;
        let pulseRadius = 0;

        // 1. AI認識エンジン初期化 (MediaPipe)
        const faceDetection = new FaceDetection({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${file}`
        });
        faceDetection.setOptions({ modelSelection: 0, minDetectionConfidence: 0.5 });
        faceDetection.onResults((results) => {
            if (results.detections && results.detections.length > 0) {
                aiData.faceLandmarks = results.detections[0].landmarks;
            } else {
                aiData.faceLandmarks = null;
            }
        });

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });
        hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
        hands.onResults((results) => {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                aiData.handLandmarks = results.multiHandLandmarks[0];
            } else {
                aiData.handLandmarks = null;
            }
        });

        // 2. カメラのセットアップとMediaPipeループの起動
        async function initCamera() {
            canvas.width = 1280;
            canvas.height = 720;

            const camera = new Camera(video, {
                onFrame: async () => {
                    // 毎フレームAIによる手と顔の検出を実行
                    await faceDetection.send({ image: video });
                    await hands.send({ image: video });
                    render();
                },
                width: 1280,
                height: 720,
                facingMode: 'user' // 自撮り優先（インタラクティブのため）
            });
            
            camera.start().then(() => {
                loadingOverlay.style.opacity = 0;
                setTimeout(() => loadingOverlay.style.display = 'none', 500);
            });
        }

        // 3. 描画 & エフェクト処理のメインループ
        function render() {
            ctx.clearRect(0,0,canvas.width, canvas.height);
            // カメラ映像を描画
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // エフェクト分岐
            if (currentEffect === 'cyber_eye') applyCyberEye();
            if (currentEffect === 'hand_aura') applyHandAura();
            if (currentEffect === 'glitch') applyGlitchEffect();
            if (currentEffect === 'vhs') applyVHSEffect();
        }

        // --- 🧪 インタラクティブ・エフェクトの実装 ---

        // ① サイバー・アイ (目の検出と照準追従)
        function applyCyberEye() {
            if (!aiData.faceLandmarks) return;

            // MediaPipeの顔ランドマークインデックス: 0:左目, 1:右目
            // キャンバスが反転しているため座標を計算
            const leftEye = aiData.faceLandmarks[0];
            const rightEye = aiData.faceLandmarks[1];

            pulseRadius = (pulseRadius + 1) % 30;

            [leftEye, rightEye].forEach((eye) => {
                const x = eye.x * canvas.width;
                const y = eye.y * canvas.height;

                // 照準サークル（外側）
                ctx.strokeStyle = '#00ffcc';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(x, y, 25 + Math.sin(pulseRadius*0.2)*3, 0, Math.PI * 2);
                ctx.stroke();

                // 十字線
                ctx.beginPath();
                ctx.moveTo(x - 35, y); ctx.lineTo(x + 35, y);
                ctx.moveTo(x, y - 35); ctx.lineTo(x, y + 35);
                ctx.stroke();

                // 中心点
                ctx.fillStyle = '#ff3b30';
                ctx.beginPath();
                ctx.arc(x, y, 4, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        // ② ハンド・オーラ (手頭からのエフェクト湧き出し)
        function applyHandAura() {
            if (!aiData.handLandmarks) return;

            // 人差し指の先端 (Index Finger Tip) はインデックス番号 8
            const indexTip = aiData.handLandmarks[8];
            const x = indexTip.x * canvas.width;
            const y = indexTip.y * canvas.height;

            // ネオンのオーラ波紋を描画
            glitchT++;
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#00ffcc';
            
            for(let i=0; i<3; i++) {
                let r = ((glitchT * 2) + i * 20) % 60;
                ctx.strokeStyle = `rgba(0, 255, 204, ${1 - r/60})`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.stroke();
            }
            // シャドウをリセット
            ctx.shadowBlur = 0;

            // つまみ動作（親指と人差し指が近づいたら画面がバグる）などの追加ロジックも今後ここに拡張可能
        }

        // ③ 標準サイバー・グリッチ
        function applyGlitchEffect() {
            glitchT++;
            let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            let data = imgData.data;
            let width = canvas.width;
            let height = canvas.height;
            let isGlitchFrame = glitchT % 25 < 3; 
            let shiftOffset = isGlitchFrame ? Math.floor((Math.random() - 0.5) * 50) : 0;
            let split = 12;
            let tempData = new Uint8ClampedArray(data);

            for (let y = 0; y < height; y++) {
                let lineShift = shiftOffset;
                if (isGlitchFrame && Math.random() < 0.1) lineShift += Math.floor((Math.random() - 0.5) * 60);
                for (let x = 0; x < width; x++) {
                    let targetX = (x + lineShift + width) % width;
                    let destIdx = (y * width + x) * 4;
                    let rX = (targetX - split + width) % width;
                    let bX = (targetX + split) % width;
                    data[destIdx] = tempData[(y * width + rX) * 4];
                    data[destIdx + 1] = tempData[(y * width + targetX) * 4 + 1];
                    data[destIdx + 2] = tempData[(y * width + bX) * 4 + 2];
                }
            }
            ctx.putImageData(imgData, 0, 0);
        }

        // ④ Y2K VHS
        function applyVHSEffect() {
            glitchT++;
            ctx.fillStyle = 'rgba(255, 200, 150, 0.05)'; 
            ctx.globalCompositeOperation = 'color-burn';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.globalCompositeOperation = 'source-over';

            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            for (let i = (glitchT % 4); i < canvas.height; i += 4) {
                ctx.fillRect(0, i, canvas.width, 1);
            }

            ctx.font = 'bold 26px monospace';
            ctx.fillStyle = '#00ffcc';
            ctx.fillText('● AI_REC', 50, 60);
        }

        // --- 📱 UI / 録画管理ロジック ---
        fxSelector.addEventListener('click', (e) => {
            if (e.target.classList.contains('fx-btn')) {
                document.querySelectorAll('.fx-btn').forEach(btn => btn.classList.remove('active'));
                e.target.classList.add('active');
                currentEffect = e.target.getAttribute('data-effect');
            }
        });

        recordBtn.addEventListener('click', () => {
            if (!isRecording) startRecording();
            else stopRecording();
        });

        function startRecording() {
            isRecording = true;
            recordedChunks = [];
            recordBtn.classList.add('recording');
            recStatus.style.display = 'flex';
            startTime = Date.now();
            timerInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - startTime) / 1000);
                recTime.textContent = `${String(Math.floor(elapsed / 60)).padStart(2,'0')}:${String(elapsed % 60).padStart(2,'0')}`;
            }, 1000);

            const canvasStream = canvas.captureStream(30);
            if (video.srcObject && video.srcObject.getAudioTracks().length > 0) {
                canvasStream.addTrack(video.srcObject.getAudioTracks()[0]);
            }

            mediaRecorder = new MediaRecorder(canvasStream, { mimeType: 'video/webm;codecs=vp9' });
            mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `AI_FX_${Date.now()}.webm`;
                a.click();
            };
            mediaRecorder.start();
        }

        function stopRecording() {
            isRecording = false;
            recordBtn.classList.remove('recording');
            recStatus.style.display = 'none';
            clearInterval(timerInterval);
            mediaRecorder.stop();
        }

        // アプリ始動
        initCamera();
    </script>
</body>
</html>
